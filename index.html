:root{color-scheme:light;--ac:#1d4ed8;--ac2:#eef3ff;--tx:#0f172a;--mu:#64748b;--bd:#e3e8f1;--bg:#f5f7fb;box-sizing:border-box}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#fff;border-bottom:1px solid var(--bd)}
.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1d4ed8,#5b93ff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand b{display:block;font-size:15px}.brand small{color:var(--mu);font-size:12px}.acts{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--tx);padding:8px 14px}
button:hover{border-color:#c5cee0}.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(29,78,216,.28)}.pri:hover{background:#1a44bd;border-color:#1a44bd}
#app{display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:18px;padding:18px;max-width:1560px;margin:0 auto;align-items:start}
@media(max-width:900px){#app{grid-template-columns:1fr;padding:12px}.top{padding:8px 12px}.brand small{display:none}}
#form{display:flex;flex-direction:column}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card h2{display:flex;align-items:center;justify-content:space-between;gap:9px;font-size:14px;margin:0 0 12px}.pgb{font-size:11px;font-weight:700;color:var(--ac);background:var(--ac2);border-radius:999px;padding:3px 9px;white-space:nowrap}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}label:first-child{margin-top:0}
input,select,textarea{font:inherit;color:var(--tx);background:#fff;border:1px solid #d5dbe8;border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,78,216,.14)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}[hidden]{display:none!important}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{padding:11px 6px;text-align:center;font-weight:600;line-height:1.2;border:1.5px solid var(--bd)}
.seg small{display:block;font-weight:400;color:var(--mu);font-size:11px;margin-top:3px}.seg button.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 112px auto 28px;gap:6px;margin-bottom:8px;align-items:center}
.amt{position:relative}.amt span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu)}.amt input{padding-left:24px}
.chip{margin:0}.chip input{display:none}.chip span{display:block;border:1px solid #d5dbe8;padding:7px 10px;border-radius:999px;font-size:12px;color:var(--mu);cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--ac2);color:var(--ac);border-color:var(--ac);font-weight:700}
.x{border:none;background:none;color:#94a3b8;padding:4px;font-size:15px}.x:hover{color:#dc2626}
.ghost{width:100%;border-style:dashed;color:var(--ac);font-weight:600;background:#fafcff}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.sum div{background:var(--bg);border-radius:10px;padding:8px 10px}
.sum small{display:block;color:var(--mu);font-size:11px}.sum b{font-size:15px}.sum .tot{background:var(--ac2)}.sum .tot b{color:var(--ac)}

</style><style id="bgs"></style></head><body>
<header class="top"><div class="brand"><div class="logo">SM</div><div><b>Proposal Generator</b><small>Startup Movers · fill the steps, then save as PDF</small></div></div><div class="acts"><button id="dl" type="button" hidden>Download HTML</button><button class="pri" id="pr" type="button">Save as PDF</button></div></header>
<div id="app"><aside id="form">
<section class="card"><h2><span>Choose proposal type</span><span class="pgb">Start</span></h2><div class="seg" id="seg"><button type="button" data-t="pvt">Private Limited<small>Indian + NRI directors</small></button><button type="button" data-t="s8">Section 8<small>Not-for-profit</small></button><button type="button" data-t="sp">Sole Prop.<small>GST + MSME</small></button></div>
<select id="ty" hidden><option value="pvt">Private Limited Company</option><option value="s8">Section 8 Company</option><option value="sp">Sole Proprietorship</option></select></section>
<section class="card" data-g="ref date email sal"><h2><span>Cover letter</span><span class="pgb"></span></h2>
<div class="g2"><div data-for="pvt s8"><label>Reference no.</label><input id="ref" value="SM/HV/"></div><div data-for="pvt s8"><label>Date</label><input id="dt" type="date"></div></div>
<div data-for="pvt"><label>Client email ID</label><input id="em" type="email" placeholder="client@gmail.com"></div>
<label>Salutation</label><select id="sals"><option value="Dear Sir,">Dear Sir,</option><option value="Dear Ma’am,">Dear Ma’am,</option><option value="Dear Sir/Ma’am,">Dear Sir/Ma’am,</option><option value="__c">Dear … (custom name)</option></select>
<input id="salc" hidden placeholder="Client name, e.g. Mr. Sharma" style="margin-top:8px"></section>
<section class="card" data-g="sig desig"><h2><span>Signature</span><span class="pgb"></span></h2>
<div class="g2"><div><label>Your name</label><input id="sig" placeholder="Your name"></div><div><label>Designation</label><input id="des" value="Executive, Business Development"></div></div></section>
<section class="card" data-for="pvt s8" data-g="time"><h2><span>Timeline</span><span class="pgb"></span></h2><textarea id="tm" rows="3"></textarea></section>
<section class="card" data-for="pvt s8" data-g="intro n"><h2><span>Directors and DSC rates</span><span class="pgb"></span></h2>
<div class="g2"><div><label>Indian directors</label><input id="ni" type="number" min="0" value="2"></div><div><label>NRI / foreign directors</label><input id="nf" type="number" min="0" value="0"></div></div>
<div class="g2"><div><label>Indian DSC rate (₹ each)</label><input id="ri" type="number" value="2500"></div><div><label>NRI DSC rate (₹ each)</label><input id="rf" type="number" value="6000"></div></div></section>
<section class="card" data-g="tbl stamp"><h2><span>Fees</span><span class="pgb"></span></h2>
<div data-for="pvt s8"><label>State (stamp duty / govt. fees)</label><input id="st" placeholder="e.g. Karnataka"></div>
<label>Fee lines <span style="font-weight:400">· tick GST where 18% applies</span></label><div id="rows"></div><button class="ghost" id="add" type="button">+ Add fee line</button>
<div class="sum" id="sum"></div>
<label class="opt" id="sw" hidden style="margin-top:12px"><input id="sl" type="checkbox" checked><span><b>Stamp duty can be paid at the last stage</b><small>Adds the line “you can also pay the stamp duty at the last stage of incorporation”.</small></span></label>
<p class="hint">Changing type, directors, rates or state reloads the default fee lines.</p></section>
<section class="card" id="dwc" hidden data-g="docs"><h2><span>List of documents</span><span class="pgb"></span></h2>
<label class="opt"><input id="dc" type="checkbox" checked><span><b>Add the list of documents page</b><small>Office address, Indian directors and foreign director documents. Added at the end of the proposal.</small></span></label></section>
</aside><main><div class="pt"><span>Live preview · A4</span><span>Updates as you type</span></div><div id="pvw"><div id="pv"></div></div></main></div>

style=\"left:72.0pt;top:407.7pt;font-size:11.5pt;line-height:11.5pt;\">your startup's journey from Start to Scale. </div><div class=\"l\" style=\"left:71.0pt;top:423.2pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:437.6pt;font-size:11.5pt;line-height:11.5pt;\">Our seasoned team brings a wide range of expertise, encompassing everything from accounting, </div><div class=\"l\" style=\"left:72.0pt;top:452.0pt;font-size:11.5pt;line-height:11.5pt;\">taxation, secretarial &amp; legal matters to business &amp; fundraising advisory. Our fluency in the </div><div class=\"l\" style=\"left:72.0pt;top:466.4pt;font-size:11.5pt;line-height:11.5pt;\">intricacies of the startup landscape is matched by our reputation for delivering flexible, </div><div class=\"l\" style=\"left:72.0pt;top:481.2pt;font-size:11.5pt;line-height:11.5pt;\">transparent, and growth-oriented solutions. </div><div class=\"l\" style=\"left:71.0pt;top:496.3pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:510.3pt;font-size:11.5pt;line-height:11.5pt;\">Established in 2014, our vision is to be the primary catalyst for growth in the Indian startup </div><div class=\"l\" style=\"left:72.0pt;top:524.8pt;font-size:11.5pt;line-height:11.5pt;\">ecosystem. By providing a one-stop shop for all finance, compliance, and accounting-related </div><div class=\"l\" style=\"left:72.0pt;top:539.2pt;font-size:11.5pt;line-height:11.5pt;\">matters, we consistently add value and save both time and money for startup founders across </div><div class=\"l\" style=\"left:72.0pt;top:553.9pt;font-size:11.5pt;line-height:11.5pt;\">their growth trajectory. </div><div class=\"l\" style=\"left:71.0pt;top:569.0pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:583.1pt;font-size:11.5pt;line-height:11.5pt;width:444.2pt;text-align:justify;text-align-last:justify;\">Over 350 founders trust us every day to ensure their business has the best chance of success </div><div class=\"l\" style=\"left:71.0pt;top:598.6pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:610.8pt;font-size:11.5pt;line-height:13.3pt;width:76.1pt;text-align:justify;text-align-last:justify;\"><b>2.</b><b> </b><b>Our Proposal </b></div><div class=\"l\" style=\"left:71.0pt;top:628.1pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:642.2pt;font-size:11.5pt;line-height:11.5pt;width:449.5pt;text-align:justify;text-align-last:justify;\">The scope of services, along with its timelines and professional fees, has been provided at </div><div class=\"l\" style=\"left:72.0pt;top:656.6pt;font-size:11.5pt;line-height:11.5pt;\"><b>Annexure A </b>to this Proposal. </div>"},{"bg":1,"pre":"<div class=\"l\" style=\"left:72.0pt;top:100.1pt;font-size:11.5pt;line-height:13.3pt;\"><b>3.</b><b> </b><b>Our Approach </b></div><div class=\"l\" style=\"left:72.0pt;top:117.1pt;font-size:11.5pt;line-height:11.5pt;\">We believe in a collaborative and tailored approach to address the needs of startups. Our </div><div class=\"l\" style=\"left:72.0pt;top:131.8pt;font-size:11.5pt;line-height:11.5pt;\">methodology emphasizes thorough analysis, strategic planning, and personalized solutions to </div><div class=\"l\" style=\"left:72.0pt;top:146.2pt;font-size:11.5pt;line-height:11.5pt;\">ensure the success and growth of your venture. </div><div class=\"l\" style=\"left:71.0pt;top:161.4pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:173.6pt;font-size:11.5pt;line-height:13.3pt;width:87.3pt;text-align:justify;text-align-last:justify;\"><b>4.</b><b> </b><b>Team Expertise </b></div><div class=\"l\" style=\"left:71.0pt;top:190.5pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:204.6pt;font-size:11.5pt;line-height:11.5pt;\">You shall be allocated a dedicated Point of Contact (POC) for services who shall be available over </div><div class=\"l\" style=\"left:72.0pt;top:219.0pt;font-size:11.5pt;line-height:11.5pt;\">email and call to coordinate with you and answer your questions. The concerned POC will </div><div class=\"l\" style=\"left:72.0pt;top:233.4pt;font-size:11.5pt;line-height:11.5pt;\">have relevant experience and expertise to provide you a smooth and hassle-free experience. </div><div class=\"l\" style=\"left:71.0pt;top:249.2pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:261.5pt;font-size:11.5pt;line-height:13.3pt;width:68.9pt;text-align:justify;text-align-last:justify;\"><b>5.</b><b> </b><b>Way Ahead </b></div><div class=\"l\" style=\"left:71.0pt;top:278.8pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:292.8pt;font-size:11.5pt;line-height:11.5pt;\">You are required to provide a written acceptance to the proposal via email along with the </div><div class=\"l\" style=\"left:72.0pt;top:307.2pt;font-size:11.5pt;line-height:11.5pt;\">payment of advance fees, as provided in the proposal. Our team will, accordingly, kick start </div><div class=\"l\" style=\"left:72.0pt;top:321.6pt;font-size:11.5pt;line-height:11.5pt;\">the assignment in collaboration with you. Our aim is to complete the tasks as per the scope </div><div class=\"l\" style=\"left:72.0pt;top:336.0pt;font-size:11.5pt;line-height:11.5pt;\">of services in a time-bound and efficient manner. </div><div class=\"l\" style=\"left:71.0pt;top:351.1pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:363.8pt;font-size:11.5pt;line-height:13.3pt;width:63.5pt;text-align:justify;text-align-last:justify;\"><b>6.</b><b> </b><b>Disclaimer </b></div><div class=\"l\" style=\"left:71.0pt;top:381.1pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:395.1pt;font-size:11.5pt;line-height:11.5pt;\">By accepting the assignment, you agree to the disclaimers as provided in <b>Annexure B </b>to this </div><div class=\"l\" style=\"left:72.0pt;top:409.9pt;font-size:11.5pt;line-height:11.5pt;\">Proposal. </div><div class=\"l\" style=\"left:71.0pt;top:425.0pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:437.2pt;font-size:11.5pt;line-height:13.3pt;width:65.6pt;text-align:justify;text-align-last:justify;\"><b>7.</b><b> </b><b>Conclusion </b></div><div class=\"l\" style=\"left:71.0pt;top:454.2pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:468.2pt;font-size:11.5pt;line-height:11.5pt;\">We appreciate the opportunity to present this proposal and eagerly anticipate the possibility </div><div class=\"l\" style=\"left:72.0pt;top:482.6pt;font-size:11.5pt;line-height:11.5pt;\">of collaborating with your venture. Should you have any further inquiries, require additional </div><div class=\"l\" style=\"left:72.0pt;top:497.4pt;font-size:11.5pt;line-height:11.5pt;\">information, or wish to discuss the proposal in more detail, please feel free to contact us at your </div><div class=\"l\" style=\"left:72.0pt;top:511.8pt;font-size:11.5pt;line-height:11.5pt;\">convenience. </div><div class=\"l\" style=\"left:71.0pt;top:527.3pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:541.3pt;font-size:11.5pt;line-height:11.5pt;width:454.3pt;text-align:justify;text-align-last:justify;\">Thank you for considering Startup Movers Private Limited as your compliance partner. We </div><div class=\"l\" style=\"left:72.0pt;top:556.1pt;font-size:11.5pt;line-height:11.5pt;width:453.4pt;text-align:justify;text-align-last:justify;\">look forward to the prospect of working together and contributing to the prosperity of your </div><div class=\"l\" style=\"left:72.0pt;top:570.8pt;font-size:11.5pt;line-height:11.5pt;\">venture. </div><div class=\"l\" style=\"left:72.0pt;top:601.1pt;font-size:11.5pt;line-height:11.5pt;\">Sincerely, </div><div class=\"l\" style=\"left:72.0pt;top:630.6pt;font-size:11.5pt;line-height:11.5pt;\">{{sig}} </div><div class=\"l\" style=\"left:72.0pt;top:646.1pt;font-size:11.5pt;line-height:11.5pt;\">{{desig}} </div><div class=\"l\" style=\"left:72.0pt;top:659.8pt;font-size:11.5pt;line-height:11.5pt;\"><b>Startup Movers Private Limited </b></div>"},{"bg":1,"pre":"<div class=\"l\" style=\"left:247.1pt;top:75.7pt;font-size:11.5pt;line-height:11.5pt;\"><b>Annexure A: Proposal </b></div><div class=\"l\" style=\"left:154.5pt;top:97.3pt;font-size:11.5pt;line-height:11.5pt;text-decoration:underline;\"><b>Proposal for Incorporating a Private Limited Company in India </b></div><div class=\"l\" style=\"left:81.0pt;top:109.8pt;font-size:11.2pt;line-height:13.0pt;\"><b>1.</b><b> </b><b>Introduction </b></div><div class=\"l\" style=\"left:95.1pt;top:125.7pt;font-size:11.5pt;line-height:11.5pt;\">A Private Limited Company is a company that is privately held for small businesses. The </div><div class=\"l\" style=\"left:95.1pt;top:140.5pt;font-size:11.5pt;line-height:11.5pt;\">liability of the members of a Private Limited Company is limited to the amount of capital </div><div class=\"l\" style=\"left:95.1pt;top:155.2pt;font-size:11.5pt;line-height:11.5pt;\">contribution. Shares of this type of company cannot be publicly traded. To start a </div><div class=\"l\" style=\"left:95.1pt;top:170.0pt;font-size:11.5pt;line-height:11.5pt;\">private company, a minimum of two and a maximum of two hundred members are </div><div class=\"l\" style=\"left:95.1pt;top:184.8pt;font-size:11.5pt;line-height:11.5pt;\">required, based on the provisions of the Companies Act, 2013. </div><div class=\"l\" style=\"left:71.0pt;top:199.9pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:95.1pt;top:213.9pt;font-size:11.5pt;line-height:11.5pt;\">The financial liability of shareholders is limited to the shares held by them. Therefore, if </div><div class=\"l\" style=\"left:95.1pt;top:228.7pt;font-size:11.5pt;line-height:11.5pt;\">a private limited company were in financial trouble and had to close, shareholders </div><div class=\"l\" style=\"left:95.1pt;top:243.1pt;font-size:11.5pt;line-height:11.5pt;\">would not risk losing their personal assets. Even after the owner dies or leaves the business, </div><div class=\"l\" style=\"left:95.1pt;top:257.9pt;font-size:11.5pt;line-height:11.5pt;\">a Private Limited Company continues to exist. The company is an independent legal entity, </div><div class=\"l\" style=\"left:95.1pt;top:272.3pt;font-size:11.5pt;line-height:11.5pt;\">and it can sue or own assets separate from the company owner. </div><div class=\"l\" style=\"left:71.0pt;top:287.8pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:95.1pt;top:301.8pt;font-size:11.5pt;line-height:11.5pt;\">A Private Limited Company is preferred by entrepreneurs as it helps them raise funds </div><div class=\"l\" style=\"left:95.1pt;top:316.2pt;font-size:11.5pt;line-height:11.5pt;\">through equity, expand, and at the same time limit their liability. </div><div class=\"l\" style=\"left:71.0pt;top:331.7pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:76.7pt;top:344.3pt;font-size:11.2pt;line-height:13.0pt;\"><b>2.</b><b> </b><b>Scope of Services </b></div><div class=\"l\" style=\"left:95.1pt;top:362.0pt;font-size:11.5pt;line-height:11.5pt;\">The scope of our services includes: </div><div class=\"l\" style=\"left:107.3pt;top:376.0pt;font-size:11.5pt;line-height:13.3pt;\">i. </div><div class=\"l\" style=\"left:131.1pt;top:377.8pt;font-size:11.5pt;line-height:11.5pt;\">Name approval of the Company </div><div class=\"l\" style=\"left:104.5pt;top:391.1pt;font-size:11.5pt;line-height:13.3pt;\">ii. </div><div class=\"l\" style=\"left:131.1pt;top:392.9pt;font-size:11.5pt;line-height:11.5pt;\">Drafting of the MOA and AOA of the Company </div><div class=\"l\" style=\"left:101.9pt;top:405.9pt;font-size:11.5pt;line-height:13.3pt;\">iii. </div><div class=\"l\" style=\"left:131.1pt;top:407.7pt;font-size:11.5pt;line-height:11.5pt;\">Obtaining the DIN of the directors, if not available </div><div class=\"l\" style=\"left:101.9pt;top:420.7pt;font-size:11.5pt;line-height:13.3pt;\">iv. </div><div class=\"l\" style=\"left:131.1pt;top:422.5pt;font-size:11.5pt;line-height:11.5pt;\">Obtaining the Digital Signature of the directors, if not available </div><div class=\"l\" style=\"left:104.5pt;top:435.1pt;font-size:11.5pt;line-height:13.3pt;\">v. </div><div class=\"l\" style=\"left:131.1pt;top:436.9pt;font-size:11.5pt;line-height:11.5pt;\">Company Incorporation </div><div class=\"l\" style=\"left:101.9pt;top:449.8pt;font-size:11.5pt;line-height:13.3pt;\">vi. </div><div class=\"l\" style=\"left:131.1pt;top:451.6pt;font-size:11.5pt;line-height:11.5pt;\">Follow up with ROC to get approval for the incorporation. </div><div class=\"l\" style=\"left:99.1pt;top:464.6pt;font-size:11.5pt;line-height:13.3pt;\">vii. </div><div class=\"l\" style=\"left:131.1pt;top:466.4pt;font-size:11.5pt;line-height:11.5pt;\">PAN and TAN of the Company. </div><div class=\"l\" style=\"left:96.2pt;top:479.4pt;font-size:11.5pt;line-height:13.3pt;\">viii. </div><div class=\"l\" style=\"left:131.1pt;top:481.2pt;font-size:11.5pt;line-height:11.5pt;\">Share certificates </div><div class=\"l\" style=\"left:101.9pt;top:495.6pt;font-size:11.5pt;line-height:13.3pt;\">ix. </div><div class=\"l\" style=\"left:131.1pt;top:497.4pt;font-size:11.5pt;line-height:11.5pt;\">ESI/PF Registration (as mandated by the Govt.) * </div><div class=\"l\" style=\"left:71.0pt;top:514.3pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:91.1pt;top:528.4pt;font-size:11.5pt;line-height:11.5pt;\"><i><b>*PF and ESI have become mandatory to apply at incorporation, but there are instances </b></i></div><div class=\"l\" style=\"left:91.1pt;top:543.1pt;font-size:11.5pt;line-height:11.5pt;\"><i><b>where, at the time of receiving a certificate of Incorporation, the email for ESI and an SMS </b></i></div><div class=\"l\" style=\"left:91.1pt;top:557.9pt;font-size:11.5pt;line-height:11.5pt;\"><i><b>for PF do not come instantly and may take extra days. In such cases, our team can only </b></i></div><div class=\"l\" style=\"left:91.1pt;top:572.6pt;font-size:11.5pt;line-height:11.5pt;\"><i><b>make relevant complaints to the department, but does not provide any commitment or </b></i></div><div class=\"l\" style=\"left:91.1pt;top:587.4pt;font-size:11.5pt;line-height:11.5pt;\"><i><b>timeline for the same. </b></i></div><div class=\"l\" style=\"left:71.0pt;top:602.5pt;font-size:11.5pt;line-height:11.5pt;\"><i><b> </b></i></div><div class=\"l\" style=\"left:76.7pt;top:615.1pt;font-size:11.2pt;line-height:13.0pt;\"><b>3.</b><b> </b><b>Methodology </b></div><div class=\"l\" style=\"left:106.6pt;top:629.6pt;font-size:11.5pt;line-height:13.3pt;\">i. </div><div class=\"l\" style=\"left:131.1pt;top:631.3pt;font-size:11.5pt;line-height:11.5pt;\">The client will share the detailed list of documents required for incorporating the </div><div class=\"l\" style=\"left:131.1pt;top:646.1pt;font-size:11.5pt;line-height:11.5pt;\">Private Limited Company </div><div class=\"l\" style=\"left:104.1pt;top:659.1pt;font-size:11.5pt;line-height:13.3pt;\">ii. </div><div class=\"l\" style=\"left:131.1pt;top:660.9pt;font-size:11.5pt;line-height:11.5pt;\">The Client has to make sure that the necessary documents are provided for the </div><div class=\"l\" style=\"left:131.1pt;top:675.3pt;font-size:11.5pt;line-height:11.5pt;\">purpose of the incorporation over email. </div><div class=\"l\" style=\"left:101.2pt;top:688.6pt;font-size:11.5pt;line-height:13.3pt;\">iii. </div><div class=\"l\" style=\"left:131.1pt;top:690.4pt;font-size:11.5pt;line-height:11.5pt;\">Our team will coordinate with the client to arrange the documents and </div><div class=\"l\" style=\"left:131.1pt;top:704.8pt;font-size:11.5pt;line-height:11.5pt;\">incorporate the Private Limited Company </div><div class=\"l\" style=\"left:101.2pt;top:717.8pt;font-size:11.5pt;line-height:13.3pt;\">iv. </div><div class=\"l\" style=\"left:131.1pt;top:719.6pt;font-size:11.5pt;line-height:11.5pt;\">In case any further document or information is required, it will be requested </div><div class=\"l\" style=\"left:131.1pt;top:734.4pt;font-size:11.5pt;line-height:11.5pt;\">during incorporation. </div>"},{"bg":1,"pre":"<div class=\"l\" style=\"left:90.0pt;top:99.8pt;font-size:11.2pt;line-height:13.0pt;\"><b>4.</b><b> </b><b>Timeline </b></div><div class=\"l w\" style=\"left:108.1pt;top:115.6pt;width:388.7pt;font-size:11.5pt;line-height:14.8pt\">{{time}}</div><div class=\"l\" style=\"left:90.0pt;top:157.0pt;font-size:11.2pt;line-height:13.0pt;width:103.5pt;text-align:justify;text-align-last:justify;\"><b>5.</b><b> </b><b>Professional Fees </b></div><div class=\"l\" style=\"left:71.0pt;top:173.6pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l w\" style=\"left:108.1pt;top:187.7pt;width:389.4pt;font-size:11.5pt;line-height:14.8pt\">{{intro}}</div><div class=\"l\" style=\"left:108.1pt;top:231.9pt;font-size:11.5pt;line-height:11.5pt;\"> </div>","fl":{"top":244.49,"left":70.85,"width":453.8,"sl":108.1,"below":"<div class=\"bk\" style=\"margin-top:17.6pt;height:11.5pt\"><div class=\"l\" style=\"left:108.1pt;top:0.0pt;font-size:11.5pt;line-height:11.5pt;\"><b>Note: </b></div></div><div class=\"bk\" style=\"margin-top:1.0pt;height:60.2pt\"><div class=\"l\" style=\"left:112.4pt;top:0.0pt;font-size:11.5pt;line-height:14.1pt;\">• </div><div class=\"l\" style=\"left:130.4pt;top:2.9pt;font-size:11.5pt;line-height:11.5pt;\">Any government fees &amp; out-of-pocket expenses shall be extra as per actuals. </div><div class=\"l\" style=\"left:112.4pt;top:15.8pt;font-size:11.5pt;line-height:14.1pt;\">• </div><div class=\"l\" style=\"left:130.4pt;top:18.8pt;font-size:11.5pt;line-height:11.5pt;\">The directors' DSCs shall be valid for 2 years. </div><div class=\"l\" ht:13.3pt;\"><b>2.</b><b> </b><b>Limitation of Liability: </b>While Startup Movers Private Limited will make every effort to </div><div class=\"l\" style=\"left:108.1pt;top:247.4pt;font-size:11.5pt;line-height:11.5pt;\">deliver high-quality services, we cannot guarantee specific outcomes or results. Our </div><div class=\"l\" style=\"left:108.1pt;top:261.8pt;font-size:11.5pt;line-height:11.5pt;\">recommendations are based on professional expertise and industry best practices, but the </div><div class=\"l\" style=\"left:108.1pt;top:276.6pt;font-size:11.5pt;line-height:11.5pt;\">ultimate decision-making and responsibility lie with the client. Startup Movers Private </div><div class=\"l\" style=\"left:108.1pt;top:291.0pt;font-size:11.5pt;line-height:11.5pt;\">Limited shall not be liable for any direct, indirect, incidental, consequential, or special </div><div class=\"l\" style=\"left:108.1pt;top:305.8pt;font-size:11.5pt;line-height:11.5pt;\">damages arising from the use of or reliance upon our accounting or compliance services. </div><div class=\"l\" style=\"left:108.1pt;top:320.2pt;font-size:11.5pt;line-height:11.5pt;\">Our liability is limited to the fees paid for the specific services rendered. </div><div class=\"l\" style=\"left:71.0pt;top:336.0pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:90.0pt;top:348.3pt;font-size:11.5pt;line-height:13.3pt;\"><b>3.</b><b> </b><b>Timely Submission of Information: </b>To ensure the timely delivery of services and </div><div class=\"l\" style=\"left:108.1pt;top:364.5pt;font-size:11.5pt;line-height:11.5pt;\">compliance filings, the client agrees to provide all necessary financial information within </div><div class=\"l\" style=\"left:108.1pt;top:378.9pt;font-size:11.5pt;line-height:11.5pt;\">agreed-upon deadlines. Delays in providing essential data may affect the timeliness and </div><div class=\"l\" style=\"left:108.1pt;top:393.3pt;font-size:11.5pt;line-height:11.5pt;\">accuracy of our services. </div><div class=\"l\" style=\"left:71.0pt;top:408.8pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:90.0pt;top:421.4pt;font-size:11.5pt;line-height:13.3pt;\"><b>4.</b><b> </b><b>Scope Limitation: </b>The scope of services provided by Startup Movers Private Limited is </div><div class=\"l\" style=\"left:108.1pt;top:437.6pt;font-size:11.5pt;line-height:11.5pt;\">limited to the agreed-upon services outlined in this proposal, based upon our anticipated </div><div class=\"l\" style=\"left:108.1pt;top:452.0pt;font-size:11.5pt;line-height:11.5pt;\">time and efforts. In case any services beyond this scope are required or if the existing </div><div class=\"l\" style=\"left:108.1pt;top:466.4pt;font-size:11.5pt;line-height:11.5pt;\">scope requires additional time and effort due to the complexity of the matter, a change </div><div class=\"l\" style=\"left:108.1pt;top:480.8pt;font-size:11.5pt;line-height:11.5pt;\">in the compliance framework, non-availability of data on time, or due to any other </div><div class=\"l\" style=\"left:108.1pt;top:495.2pt;font-size:11.5pt;line-height:11.5pt;\">matter beyond our control, Startup Movers Private Limited may charge additional fees to </div><div class=\"l\" style=\"left:108.1pt;top:510.0pt;font-size:11.5pt;line-height:11.5pt;\">the client. </div><div class=\"l\" style=\"left:71.0pt;top:525.5pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:90.0pt;top:537.7pt;font-size:11.5pt;line-height:13.3pt;\"><b>5.</b><b> </b><b>Client's Compliance Responsibility: </b>The client acknowledges their sole responsibility </div><div class=\"l\" style=\"left:108.1pt;top:554.3pt;font-size:11.5pt;line-height:11.5pt;\">for complying with all relevant laws, regulations, and industry standards. While Startup </div><div class=\"l\" style=\"left:108.1pt;top:569.0pt;font-size:11.5pt;line-height:11.5pt;\">Movers Private Limited provides guidance and support, the client retains decision-making </div><div class=\"l\" style=\"left:108.1pt;top:583.8pt;font-size:11.5pt;line-height:11.5pt;\">authority regarding compliance matters. Any failure to comply shall not hold Startup </div><div class=\"l\" style=\"left:108.1pt;top:598.6pt;font-size:11.5pt;line-height:11.5pt;\">Movers Private Limited liable, and the client indemnifies us against resulting liabilities or </div><div class=\"l\" style=\"left:108.1pt;top:613.0pt;font-size:11.5pt;line-height:11.5pt;\">penalties arising from non-compliance. </div><div class=\"l\" style=\"left:71.0pt;top:627.7pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:90.0pt;top:640.4pt;font-size:11.5pt;line-height:13.3pt;width:436.6pt;text-align:justify;text-align-last:justify;\"><b>6.</b><b> </b><b>Independent Audits and Reviews: </b>While we perform our services diligently, our services </div><div class=\"l\" style=\"left:108.1pt;top:656.9pt;font-size:11.5pt;line-height:11.5pt;width:417.8pt;text-align:justify;text-align-last:justify;\">do not substitute for independent audits or reviews required by regulatory bodies or </div><div class=\"l\" style=\"left:108.1pt;top:671.7pt;font-size:11.5pt;line-height:11.5pt;width:417.9pt;text-align:justify;text-align-last:justify;\">stakeholders. These specialized assessments may be necessary to validate financial </div><div class=\"l\" style=\"left:108.1pt;top:686.5pt;font-size:11.5pt;line-height:11.5pt;width:418.6pt;text-align:justify;text-align-last:justify;\">statements and ensure adherence to specific compliance standards. Such Audits and </div><div class=\"l\" style=\"left:108.1pt;top:701.2pt;font-size:11.5pt;line-height:11.5pt;\">Reviews do not form part of our scope of work. </div>"},{"bg":1,"pre":"<div class=\"l\" style=\"left:90.0pt;top:114.9pt;font-size:11.5pt;line-height:13.3pt;width:110.7pt;text-align:justify;text-align-last:justify;\"><b>7.</b><b> </b><b>Fees and Payment: </b></div><div class=\"l\" style=\"left:71.0pt;top:131.8pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:126.1pt;top:144.1pt;font-size:11.5pt;line-height:13.3pt;\">● Unless otherwise stated, all fees mentioned in the proposal exclude GST, </div><div class=\"l\" style=\"left:144.1pt;top:160.6pt;font-size:11.5pt;line-height:11.5pt;\">government fees, and out-of-pocket expenses. The client is liable to pay such </div><div class=\"l\" style=\"left:144.1pt;top:175.4pt;font-size:11.5pt;line-height:11.5pt;\">an amount on an actual basis. </div><div class=\"l\" style=\"left:126.1pt;top:188.4pt;font-size:11.5pt;line-height:13.3pt;\">● The fees are subject to revision as per the review date mentioned in the proposal </div><div class=\"l\" style=\"left:144.1pt;top:204.9pt;font-size:11.5pt;line-height:11.5pt;\">or in case of a significant change in the scope of work and time and effort required. </div><div class=\"l\" style=\"left:126.1pt;top:218.3pt;font-size:11.5pt;line-height:13.3pt;\">● In case the Client fails to make the payment of the consideration as per the terms </div><div class=\"l\" style=\"left:144.1pt;top:234.8pt;font-size:11.5pt;line-height:11.5pt;\">of the payment agreed to within 7 days of the amount becoming due, the </div><div class=\"l\" style=\"left:144.1pt;top:249.2pt;font-size:11.5pt;line-height:11.5pt;\">Client shall be liable to pay late fees/interest @24% P.A. on the delayed payment. </div><div class=\"l\" style=\"left:144.1pt;top:263.6pt;font-size:11.5pt;line-height:11.5pt;\">Further, after the expiry of the period of 7 days as above stated, the Work under </div><div class=\"l\" style=\"left:144.1pt;top:278.0pt;font-size:11.5pt;line-height:11.5pt;\">this Agreement may immediately be put on hold, and the period of hold shall </div><div class=\"l\" style=\"left:144.1pt;top:292.4pt;font-size:11.5pt;line-height:11.5pt;\">continue till the release of payment of consideration to the Consultant. </div><div class=\"l\" style=\"left:71.0pt;top:307.9pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\" ither party can terminate this engagement by providing 30 days’ notice. </div><div class=\"l\" style=\"left:109.9pt;top:497.0pt;font-size:11.5pt;line-height:11.5pt;\">The Client remains liable for payment due for work completed before termination. </div><div class=\"l\" style=\"left:71.0pt;top:512.5pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:90.0pt;top:526.6pt;font-size:11.5pt;line-height:11.5pt;width:418.6pt;text-align:justify;text-align-last:justify;\">These disclaimers serve to protect both parties involved in the engagement and set clear </div><div class=\"l\" style=\"left:90.0pt;top:541.3pt;font-size:11.5pt;line-height:11.5pt;\">expectations regarding responsibilities and limitations. </div>"}],"s8":[{"bg":2,"pre":"<div class=\"l\" style=\"left:72.0pt;top:199.0pt;font-size:11.7pt;line-height:11.5pt;\"><b>Proposal for Section 8 Company Incorporation </b></div><div class=\"l\" style=\"left:73.5pt;top:213.7pt;font-size:11.7pt;line-height:11.5pt;width:67.4pt;text-align:justify;text-align-last:justify;\"><b>{{ref}}</b><b> </b></div><div class=\"l\" style=\"left:70.8pt;top:229.3pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:243.2pt;font-size:11.5pt;line-height:11.5pt;\">{{date}} </div><div class=\"l\" style=\"left:70.8pt;top:257.1pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:70.8pt;top:272.7pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:286.7pt;font-size:11.7pt;line-height:11.5pt;width:43.9pt;text-align:justify;text-align-last:justify;\"><b>{{sal}}</b><b> </b></div><div class=\"l\" style=\"left:70.8pt;top:302.3pt;font-size:11.5pt;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:316.2pt;font-size:11.7pt;line-height:11.5pt;\">We are pleased to present this proposal outlining the scope of services offered by Startup </div><div class=\"l\" style=\"left:72.0pt;top:330.8pt;font-size:11.7 ;line-height:11.5pt;\"><b> </b></div><div class=\"l\" style=\"left:72.0pt;top:133.4pt;font-size:11.5pt;line-height:13.3pt;\"><b>1.</b><b> </b><b>Introduction</b><b> </b></div><div class=\"l\" style=\"left:90.0pt;top:149.8pt;font-size:11.7pt;line-height:11.5pt;\">Section 8 Company is a Company formed with the objective of promoting commerce, art, </div><div class=\"l\" style=\"left:90.0pt;top:164.5pt;font-size:11.7pt;line-height:11.5pt;\">science, sports, education, research, social welfare, religion, charity, protection of the </div><div class=\"l\" style=\"left:90.0pt;top:179.1pt;font-size:11.7pt;line-height:11.5pt;\">environment, or any other object. It is established mainly for charitable or not-for-profit </div><div class=\"l\" style=\"left:90.0pt;top:193.5pt;font-size:11.7pt;line-height:11.5pt;\">purposes. </div><div class=\"l\" style=\"left:70.8pt;top:209.1pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:90.0pt;top:223.3pt;font-size:11.7pt;line-height:11.5pt;\">Section 8 Companies enjoy more credibility as compared to NGOs, societies, and trusts </div><div class=\"l\" style=\"left:90.0pt;top:237.9pt;font-size:11.7pt;line-height:11.5pt;\">because they are recognized by the Central Government’s license. Such a company is </div><div class=\"l\" style=\"left:90.0pt;top:252.3pt;font-size:11.7pt;line-height:11.5pt;\">exempt from the payment of stamp duty applicable for registration, as applicable in the </div><div class=\"l\" style=\"left:90.0pt;top:267.0pt;font-size:11.7pt;line-height:11.5pt;\">case of other structures, such as a private limited or a public limited company. </div><div class=\"l\" style=\"left:70.8pt;top:282.1pt;font-size:11.5pt;line-height:11.5pt;\"> </div><div class=\"l\" style=\"left:72.0pt;top:294.5pt;font-size:11.5pt;line-height:13.3pt;\"><b>2.</b><b> </b><b>Scope of Services</b><b> </b></div><div class=\"l\" style=\"left:90.0pt;top:310.9pt;font-size:11.7pt;line-height:11.5pt;\">The scope of our services includes: function preset(){
 const T=v('ty'),i=+v('ni')||0,f=+v('nf')||0,s=v('st').trim(),ri=+v('ri')||0,rf=+v('rf')||0;
 const pl=(n,w)=>n>1?` (${n} ${w}s)`:'';
 if(T=='pvt'){R=[{n:'Professional Fees for Incorporation',a:20000,t:1}];
  if(f)R.push({n:'NRI Director DSC'+pl(f,'Director'),a:f*rf,t:1});
  if(i)R.push({n:'Indian Director DSC'+pl(i,'Director'),a:i*ri,t:1});
  R.push({n:'Name Approval',a:1000,t:0},{n:'Stamp Duty'+(s?` (${s})`:''),a:10020,t:0},{n:'PAN & TAN',a:200,t:0});}
 else if(T=='s8'){R=[{n:'Incorporation of a Section 8 Company',a:7000,t:1}];
  if(i)R.push({n:`${i} ${i>1?"Directors' DSCs":"Director's DSC"} (Rs. ${fmt(ri)} per DSC Cost)`,a:i*ri,t:1});
  if(f)R.push({n:`${f} NRI ${f>1?"Directors' DSCs":"Director's DSC"} (Rs. ${fmt(rf)} per DSC Cost)`,a:f*rf,t:1});
  R.push({n:'DSC Courier Charges',a:100,t:1},{n:'Name Approval',a:1000,t:0},{n:'PAN/TAN',a:200,t:0},{n:`Government Fees (${s||'State'})`,a:135,t:0});}

 rows();render();

function rows(){$('rows').innerHTML=R.map((r,k)=>`<div class="row" data-k="${k}"><input class="n" placeholder="Particulars" value="${esc(r.n).replace(/"/g,'&quot;')}"><div class="amt"><span>₹</span><input class="a" type="number" value="${r.a}"></div><label class="chip"><input class="t" type="checkbox"${r.t?' checked':''}><span>GST</span></label><button class="x" type="button" title="Remove">✕</button></div>`).join('')}

function table(T,c){let h;
 if(T=='pvt'){h='<table class="t1"><tr><th class="c">S. No.</th><th>Particulars</th><th class="r">Amount</th></tr>'+R.map((r,k)=>`<tr><td class="c">${k+1}</td><td>${esc(r.n)}</td><td class="r">₹${fmt(+r.a||0)}</td></tr>`).join('')+
  `<tr class="b"><td></td><td>Subtotal</td><td class="r">₹${fmt(c.sub)}</td></tr><tr><td></td><td>GST @ 18% on Professional Fees and DSC Charges (₹${fmt(c.tx)})</td><td class="r">₹${fmt(c.g)}</td></tr><tr class="b"><td></td><td>Grand Total</td><td class="r">₹${fmt(c.tot)}</td></tr></table>`}
 else if(T=='s8'){h='<table class="t2"><colgroup><col style="width:56%"><col></colgroup><tr><th>Services</th><th><i>Professional Fees (in Rs.)</i></th></tr>'+R.map(r=>`<tr><td>${esc(r.n)}</td><td class="r"><i>Rs. ${fmt(+r.a||0)}${r.t?' + 18% GST':''}</i></td></tr>`).join('')+`<tr><td><b>Total</b></td><td class="r"><b><i>Rs. ${fmt(c.tot)}</i></b></td></tr></table>`}
 else{const all=R.length&&R.every(r=>r.t);h='<table class="t2"><colgroup><col style="width:13%"><col style="width:47%"><col></colgroup><tr><th class="c">S. No</th><th>Scope</th><th>Professional Fee (₹)</th></tr>'+R.map((r,k)=>`<tr><td class="c">${k+1}</td><td>${esc(r.n)}</td><td class="r">Rs. ${fmt(+r.a||0)}</td></tr>`).join('')+`<tr><td></td><td>Total</td><td class="r">${all?`Rs. ${fmt(c.sub)} + 18% GST = Rs. ${fmt(c.tot)}`:`Rs. ${fmt(c.tot)}`}</td></tr></table>`}

function docsOn(){const show=v('ty')=='pvt'&&(+v('nf')||0)>0;$('dwc').hidden=!show;return show&&$('dc').checked}

});
 if(dOn)out.push(`<section class="pg bg${D[T][1].bg}">${docs(i,f)}</section>`);
 $('pv').innerHTML=out.join('').replace(/\{\{(\w+)\}\}/g,(m,k)=>`<span data-f="${k}">${V[k]??''}</span>`);mark(ACT.length?'nearest':0);layout();
 fit();
}
function layout(){const pgs=[...document.querySelectorAll('#pv .pg')];
 document.querySelectorAll('#form .card[data-g]').forEach((c,ix)=>{let m=0;c.dataset.g.split(' ').forEach(k=>{const e=document.querySelector('#pv [data-f="'+k+'"]');if(e){const n=pgs.indexOf(e.closest('.pg'))+1;if(n&&(!m||n<m))m=n}});
  c.style.order=(m||99)*10+ix;const b=c.querySelector('.pgb');if(b)b.textContent=m?'Page '+m:'—'})}
function fit(){const w=$('pvw').clientWidth,z=Math.min(1,(w-38)/794);$('pv').style.zoom=z}
function typeChanged(){const T=v('ty');autoStamp();document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));$('sals').value=T=='sp'?'Dear Sir/Ma’am,':'Dear Sir,';$('tm').value=TIME[T]||'';$('ri').value=T=='s8'?2450:2500;$('rf').value=6000;preset()}
$('ty').onchange=typeChanged;['ni','nf','ri','rf','st'].forEach(i=>$(i).oninput=preset);$('nf').addEventListener('input',()=>{autoStamp();render()});
['ref','dt','em','salc','sig','des','tm'].forEach(i=>$(i).oninput=render);$('sals').onchange=render;$('sl').onchange=render;$('dc').onchange=render;document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{$('ty').value=b.dataset.t;typeChanged()});
$('rows').oninput=e=>{const k=+e.target.closest('.row').dataset.k;if(e.target.classList.contains('n'))R[k].n=e.target.value;if(e.target.classList.contains('a'))R[k].a=e.target.value;render()};
$('rows').onchange=e=>{if(e.target.classList.contains('t')){R[+e.target.closest('.row').dataset.k].t=e.target.checked?1:0;render()}};
$('rows').onclick=e=>{if(e.target.classList.contains('x')){R.splice(+e.target.closest('.row').dataset.k,1);rows();render()}};
$('add').onclick=()=>{R.push({n:'',a:0,t:0});rows();render()};
$('pr').onclick=()=>window.print();
window.addEventListener('resize',fit);
let ACT=[];
const FM={ref:['ref'],dt:['date'],em:['email'],sals:['sal'],salc:['sal'],sig:['sig'],des:['desig'],st:['tbl','intro'],ni:['intro','n','tbl','docs'],nf:['intro','n','tbl','docs','stamp'],ri:['tbl'],rf:['tbl'],tm:['time'],sl:['stamp'],dc:['docs']};
const REV={ref:'ref',date:'dt',email:'em',sal:'sals',sig:'sig',desig:'des',time:'tm',intro:'ni',n:'ni',tbl:'rows',stamp:'sl',docs:'dc'};
function mark(go){document.querySelectorAll('#pv .on').forEach(e=>e.classList.remove('on'));let first=null;
 ACT.forEach(k=>document.querySelectorAll('#pv [data-f="'+k+'"]').forEach(e=>{e.classList.add('on');first=first||e}));
 if(go&&first)first.scrollIntoView({block:go,behavior:'smooth',inline:'nearest'})}
function act(k,go){ACT=k;mark(go)}
$('form').addEventListener('focusin',e=>{const t=e.target;let k=FM[t.id];if(t.closest('#rows'))k=['tbl'];
 if(!k){const c=t.closest('.card');k=c&&c.dataset.g?c.dataset.g.split(' '):[]}act(k,'center')});
$('form').addEventListener('click',e=>{const c=e.target.closest('.card');if(c&&c.dataset.g&&e.target.closest('h2'))act(c.dataset.g.split(' '),'center')});
$('pv').addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(!t)return;let el=$(REV[t.dataset.f]);if(!el||el.closest('[hidden]'))return;if(el.id=='rows')el=el.querySelector('input');if(!el)return;el.scrollIntoView({block:'center',behavior:'smooth'});el.focus({preventScroll:true})});
const t0=new Date();$('dt').value=t0.getFullYear()+'-'+String(t0.getMonth()+1).padStart(2,'0')+'-'+String(t0.getDate()).padStart(2,'0');
typeChanged();
if(window.claude&&claude.use)claude.use('downloads').then(dl=>{if(!dl)return;const b=$('dl');b.hidden=false;b.onclick=async()=>{const html='<!doctype html><meta charset="utf-8"><title>Proposal</title><style>'+$('css').textContent+'</style><style>'+$('bgs').textContent+'</style><div id="pv">'+$('pv').innerHTML+'</div>';try{await dl.save({filename:'proposal.html',data:html})}catch(e){}}}).catch(()=>{});
